<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up Page</title>
</head>
<body>
    <main class="container">
        <div class="card">
    <header>
    <nav>
        <a href="newfile.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="feedback.html">Feedback</a> |
        <a href="tc.html">Terms and Conditions</a>
    </nav>
</header>
        <h1>Sign-up Page</h1>
        <form id="signupform">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username"><br><br>

            <label for="email">Email address:</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email address"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Enter your password"><br><br>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" placeholder="Confirm your password"><br><br>

            <input type="submit" value="Sign Up">
        </form>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
    </div>
    </main>

    <script src="signup.js"></script>
</body>
</html>
