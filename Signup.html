<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-up page </title>
    </head>
    <body bgcolor="f4b6a6" link="brown" vlink="maroon" alink="red">
        <h1>Sign-up Page</h1>
        <form action="login.html" method="get">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username"><br><br>

            <label for="email">Email address:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>

            <input type="submit" value="Sign Up">
        </form>
