<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Page</title>
</head>
<body bgcolor="f4b6a6">
    <h1>Purchase Details</h1>
    <form>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" required placeholder="Enter your first name"><br>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" required placeholder="Enter your last name"><br>

        <label for="emailaddress">Email Address:</label>
        <input type="email" id="emailaddress" required placeholder="Enter your email address"><br>
        <label for="location">Location:</label>
        <input type="text" id="location" required placeholder="Enter your location"><br>

        <h3><strong>Gender</strong></h3>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male"><br>

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female"><br>

        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other"><br>

        <h3><strong>Select Payment Method</strong></h3>
        <select name="Payment">
            <option>M-Pesa</option>
            <option>Bank</option>
            <option>Crypto</option>
        </select>

        <h3><strong>Account Details</strong></h3>
        <label for="mpesa">M-Pesa Number:</label>
        <input type="text" id="mpesa" required placeholder="Enter your phone Number"><br>
        <label for="bank account">Bank Account Number:</label>
        <input type="text" id="bank account" required placeholder="Enter your Bank Acc No."><br>
        <label for="crypto">Crypto Address:</label>
        <input type="text" id="crypto" required placeholder="Enter your Crypto Address"><br>
    </form>
    <a href="..//Invoices/New Cat Site Invoice.pdf">
    <button>
        Purchase
    </button>
    </a>
</body>
</html>
