<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Parfumerie+Script+Pro&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Invoice</title>
</head>
<body>
    <header>
    <nav>
        <a href="newfile.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="signup.html">Sign Up</a> |
        <a href="feedback.html">Feedback</a> |
        <a href="tc.html">Terms and Conditions</a>
    </nav>
</header>
    <main class="container">
        <div class="card">
    <h1>Purchase Details</h1>
    <form id="purchaseForm">
        <input type="hidden" id="breed" name="breed">
        <input type="hidden" id="price" name="price">

        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" required placeholder="Enter your first name">

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" required placeholder="Enter your last name">

        <label for="emailaddress">Email Address:</label>
        <input type="email" id="emailaddress" required placeholder="Enter your email address">
        <label for="location">Location:</label>
        <input type="text" id="location" required placeholder="Enter your location">

        <h3><strong>Gender</strong></h3>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">

        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other">

        <h3><strong>Select Payment Method</strong></h3>
        <select name="Payment" id="paymentMethod" required>
            <option value="">--Select Payment Method--</option>
            <option value="M-Pesa">M-Pesa</option>
            <option value="Bank">Bank</option>
            <option value="Crypto">Crypto</option>
        </select>

        <h3><strong>Account Details</strong></h3>

        <div id="mpesaField" style="display: none;">
        <label for="mpesa">M-Pesa Number:</label>
        <input type="text" id="mpesa" placeholder="07XXXXXXXX"><br>
        </div>

        <div id="bankField" style="display: none;">
        <label for="bank account">Bank Account Number:</label>
        <input type="text" id="bankAccount" placeholder="XXXX XXXX XXXX XXXX"><br>
        </div>
        
        <div id="cryptoField" style="display: none;">
        <label for="crypto">Crypto Address:</label>
        <input type="text" id="crypto" placeholder="Enter your Crypto Address">
        </div>

        <button type="submit">Purchase</button>
    </form>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="invoice.js"></script>
</body>
</html>
