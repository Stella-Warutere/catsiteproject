<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>
<body>
    <main class="container">
        <div class="card">
    <header>
    <nav>
        <a href="index.html">Home</a> |
        <a href="Signup.html">Sign Up</a> |
        <a href="feedback.html">Feedback</a> |
        <a href="tc.html">Terms and Conditions</a>
    </nav>
</header>
        <h1>Login Page</h1>
        <form id="loginform">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password"><br><br>

            <input type="submit" value="Login">
        </form>
        <p>
            <a href="reset.html">Forgot password?</a>.
        </p>
        <p>
            Don't have an account? 
            <a href="Signup.html">Sign up here</a>.
        </p>
    </div>
    </main>
    <script src="login.js"></script>
</body>
</html>
