<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="5" width="50%" height="200vh">
        <tr>
            <th></th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
        </tr>
        <tr>
            <td>A</td>
            <td>70</td>
            <td>50</td>
            <td rowspan="3" style="background-color:#f4a6b6;">200</td>
        </tr>
        <tr>
            <td>E</td>
            <td>90</td>
            <td>100</td>
        </tr>
        <tr>
            <td>F</td>
            <td colspan="2">130</td>
        </tr>
    </table>
</body>
</html>
